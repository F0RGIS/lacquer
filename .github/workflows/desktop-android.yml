name: Windows and Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build game
        run: npm run build:shell
      - name: Package Electron
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Lacquer-Windows
          path: release/*.exe
          if-no-files-found: error

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install
        run: npm ci
      - name: Build game
        run: npm run build:shell
      - name: Add Android project
        run: npx cap add android
      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Lacquer-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
