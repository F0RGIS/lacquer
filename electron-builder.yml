appId: com.f0rgis.lacquer
productName: Lacquer
copyright: Copyright © 2026
asar: true
directories:
  output: release
files:
  - desktop/**/*
  - shell/dist/**/*
  - package.json
win:
  target:
    - nsis
  artifactName: Lacquer-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Lacquer
